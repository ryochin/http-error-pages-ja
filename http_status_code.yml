-
  group: Client Error
  list:
    -
      code: 400
      text: Bad Request
      title: 予期しないリクエストです
      message: リクエストの形式が正しくないため、処理できません。
    -
      code: 401
      text: Unauthorized
      title: 認証が必要です
      message: アクセスを続けるには、認証する必要があります。
    -
      code: 402
      text: Payment Required
      title: 支払いが必要です
      message: アクセスを続けるには、支払いをする必要があります。
    -
      code: 403
      text: Forbidden
      title: 公開されていません
      message: 指定されたファイルは現在公開されていません。
    -
      code: 404
      text: Not Found
      title: ファイルが見つかりません
      message: 指定されたファイルは見つかりませんでした。
    -
      code: 405
      text: Method Not Allowed
      title: このリソースにはアクセスできません
      message: 許可されていない HTTP リクエストメソッドです。
    -
      code: 406
      text: Not Acceptable
      title: リクエストは受理できません
      message: 条件に合うコンテンツを提供できません。
    -
      code: 407
      text: Proxy Authentication Required
      title: プロキシ認証が必要です
      message: アクセスを続けるには、認証する必要があります。
    -
      code: 408
      text: Request Timeout
      title: リクエストがタイムアウトしました
      message: リクエストの送信に時間がかかりすぎたため、接続を終了しました。
      description: しばらく時間をおいてもう一度お試しいただけますでしょうか。
    -
      code: 409
      text: Conflict
      title: リクエストが競合しました
      message: リクエストは現在のリソースと競合するため、完了できません。
    -
      code: 410
      text: Gone
      title: 要求されたリソースは削除されました
      message: 指定されたファイルは削除されたため、今後提供される予定はありません。
    -
      code: 411
      text: Length Required
      title: リクエストの長さが指定されていません
      message: Content-Length ヘッダーフィールド等を指定してください。
    -
      code: 412
      text: Precondition Failed
      title: 前提条件が満たされていません
      message: リクエストを完了するには、前提条件を満たす必要があります。
    -
      code: 413
      text: Payload Too Large
      title: ペイロードのサイズが大きすぎます
      message: リクエストのペイロード（ボディ）のサイズが大きすぎます。
    -
      code: 414
      text: URI Too Long
      title: URI が長すぎます
      message: リクエストの URI が長すぎます。
      description: 大きなファイルを GET メソッドで送信しているのかもしれません。
    -
      code: 415
      text: Unsupported Media Type
      title: サポートされていないメディアの種類です
      message: 指定されたメディアの種類（MIME タイプ）はサポートされていません。
    -
      code: 416
      text: Range Not Satisfiable
      title: 指定された範囲が不正です
      message: 実リソースのサイズを超えるデータが要求されました。
    -
      code: 417
      text: Expectation Failed
      title: Expect ヘッダーフィールドによる拡張が失敗しました
      message: Expect ヘッダーフィールドで指定された要求に応えられません。
    -
      code: 421
      text: Misdirected Request
      title: リクエストの送信先が誤っています
      message: このサーバーはこのリクエストに応答できません。
    -
      code: 422
      text: Unprocessable Entity
      title: 入力値の検証に失敗しました
      message: リクエストの内容を処理できませんでした。入力内容に誤りがあるか、認証情報が無効になっている可能性があります。
      note: |
        Ruby on Rails では次の例外時に送出される。
          * ActionController::InvalidAuthenticityToken
          * ActionController::InvalidCrossOriginRequest
          * ActiveRecord::RecordInvalid
          * ActiveRecord::RecordNotSaved
    -
      code: 423
      text: Locked
      rfc: 4918
      title: ロックされています
      message: リクエストされたリソースはロックされています。
      note: |
        WebDAV の拡張ステータスコード。
    -
      code: 424
      text: Failed Dependency
      rfc: 4918
      title: 依存するリクエストが失敗しました
      message: 依存する別のリクエストが失敗したため、処理できません。
      note: |
        WebDAV の拡張ステータスコード。
    -
      code: 425
      text: Too Early
      title: 早期データは受け入れられません
      message: 新規に TLS 接続を確立し、リクエストを再送してください。
    -
      code: 426
      text: Upgrade Required
      rfc: 7231
      title: アップグレードしてください
      message: 別のプロトコル（TLS など）にアップグレードしてからリクエストしてください。
    -
      code: 428
      text: Precondition Required
      rfc: 6585
      title: 前提条件が必要です
      message: If-Match などの条件を指定してリクエストしてください。
    -
      code: 429
      text: Too Many Requests
      rfc: 6585
      title: リクエストが多すぎます
      message: リクエストが多すぎるため、応答できません。
    -
      code: 431
      text: Request Header Fields Too Large
      rfc: 6585
      title: リクエストヘッダーフィールドが大きすぎます
      message: リクエストヘッダーフィールドが大きすぎるため、処理できません。
    -
      code: 451
      text: Unavailable For Legal Reasons
      rfc: 7725
      title: 法的な理由により提供できません
      message: 法的な理由により、リクエストされたリソースは提供できません。

-
  group: Server Error
  list:
    -
      code: 500
      text: Internal Server Error
      title: 処理中にエラーが発生しました
      message: 恐れ入りますが、もう一度操作していただけますでしょうか。
      description: しばらくたっても復旧しない場合はお知らせいただけますと幸いです。
    -
      code: 501
      text: Not Implemented
      title: このリソースにはアクセスできません
      message: 機能が実装されていません。
    -
      code: 502
      text: Bad Gateway
      title: サーバーが応答しません
      message: サーバーが適切な応答を返しませんでした。サーバーが一時的にダウンしている可能性があります。
      description: しばらくたっても復旧しない場合はお知らせいただけますと幸いです。
    -
      code: 503
      text: Service Unavailable
      title: 現在、サービスは利用できません
      message: 一時的な過負荷やメンテナンスのため、現在はアクセスすることができません。
      description: しばらく時間をおいてもう一度お試しいただけますでしょうか。
    -
      code: 504
      text: Gateway Timeout
      title: リクエストがタイムアウトしました
      message: サーバーからの応答に時間がかかりすぎたため、応答を受け取れませんでした。
      description: しばらく時間をおいてもう一度お試しいただけますでしょうか。
    -
      code: 505
      text: HTTP Version Not Supported
      title: このリソースにはアクセスできません
      message: サポートされていない HTTP バージョンです。
    -
      code: 506
      text: Variant Also Negotiates
      rfc: 2295
      title: このリソースにはアクセスできません
      message: サーバーの透過的コンテンツネゴシエーションに関する内部構成に問題があります。
    -
      code: 507
      text: Insufficient Storage
      rfc: 4918
      title: 容量不足です
      message: リクエストを処理するために必要なストレージの容量が足りません。
      note: |
        WebDAV の拡張ステータスコード。
    -
      code: 508
      text: Loop Detected
      rfc: 5842
      title: ループを検出しました
      message: ループを検出したため、アクセスできません。
      note: |
        WebDAV の拡張ステータスコード。
    -
      code: 509
      text: Bandwidth Limit Exceeded
      title: 帯域幅制限をオーバーしています
      message: サーバーに設定されている帯域幅（転送量）制限を超過したため、アクセスできません。
    -
      code: 510
      text: Not Extended
      rfc: 2774
      title: このリソースにはアクセスできません
      message: リクエストを処理するには、さらなる拡張が必要です。
      note: |
        廃止済み。
    -
      code: 511
      text: Network Authentication Required
      rfc: 6585
      title: ネットワークに対する認証が必要です
      message: アクセスを続けるには、認証する必要があります。
